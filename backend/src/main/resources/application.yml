server:
  port: ${PORT:8080}

spring:
  application:
    name: brickwise-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

brickwise:
  db-path: ${DB_PATH:./brickwise.db}
  documents-dir: ${DOCUMENTS_DIR:./data/documents}
  property-images-dir: ${PROPERTY_IMAGES_DIR:./data/property-images}
  mail-from: ${MAIL_FROM:noreply@brickwise.local}
  qbo:
    client-id: ${QBO_CLIENT_ID:}
    client-secret: ${QBO_CLIENT_SECRET:}
    redirect-uri: ${QBO_REDIRECT_URI:http://localhost:8080/api/v1/integrations/qbo/callback}
    frontend-redirect: ${QBO_FRONTEND_REDIRECT:http://localhost:5173/settings/quickbooks}
    environment: ${QBO_ENVIRONMENT:sandbox}

logging:
  level:
    com.brickwise: INFO
